services:
  # Python analysis + OCR service. Internal only — not published to the host.
  service:
    build:
      context: .
      dockerfile: service.Dockerfile
    environment:
      STOCKFISH_PATH: /usr/games/stockfish
      CHESS_AGENT_MCP_URL: ${CHESS_AGENT_MCP_URL:-http://host.docker.internal:8080/mcp}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-reasoner}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      LIBRECHAT_ENDPOINT: ${LIBRECHAT_ENDPOINT:-https://njxai.com}
      LIBRECHAT_API_KEY: ${LIBRECHAT_API_KEY:-}
      LIBRECHAT_MODEL: ${LIBRECHAT_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Next.js web app — the only service exposed to the internet.
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Checkmate Coach}
    environment:
      DATABASE_PATH: /data/chess.db
      PYTHON_SERVICE_URL: http://service:8000
      SITE_URL: ${SITE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@checkmatecoach.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
    volumes:
      - chess-data:/data
    ports:
      - "127.0.0.1:3000:3000" # localhost only; Cloudflare Tunnel is the public entrypoint
    depends_on:
      - service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chess-data:
