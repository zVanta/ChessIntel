services:
  # Python analysis + OCR service. Internal only — not published to the host.
  service:
    build:
      context: .
      dockerfile: service.Dockerfile
    environment:
      STOCKFISH_PATH: /usr/games/stockfish
      CHESS_AGENT_MCP_URL: ${CHESS_AGENT_MCP_URL:-http://host.docker.internal:8080/mcp}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      LIBRECHAT_ENDPOINT: ${LIBRECHAT_ENDPOINT:-https://njxai.com}
      LIBRECHAT_API_KEY: ${LIBRECHAT_API_KEY:-}
      LIBRECHAT_MODEL: ${LIBRECHAT_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Next.js web app — the only service exposed to the internet.
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Checkmate Coach}
    environment:
      DATABASE_PATH: /data/chess.db
      PYTHON_SERVICE_URL: http://service:8000
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@checkmatecoach.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      BILLING_ENABLED: ${BILLING_ENABLED:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
    volumes:
      - chess-data:/data
    ports:
      - "127.0.0.1:3000:3000" # localhost only; Caddy is the public entrypoint
    depends_on:
      - service
    restart: unless-stopped

  # Cloudflare Tunnel — no inbound ports needed; Cloudflare handles DNS + TLS.
  # In the Cloudflare dashboard, route chess.njxai.com to http://web:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  chess-data:
